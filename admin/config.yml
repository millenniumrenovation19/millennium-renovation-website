backend:
  name: github
  repo: millenniumrenovation19/millennium-renovation-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Company Information"
        name: "company"
        file: "content/company.json"
        format: "json"
        fields:
          - {label: "Company Name", name: "name", widget: "string"}
          - {label: "Phone Number", name: "phone", widget: "string"}
          - {label: "Email Address", name: "email", widget: "string"}
          - {label: "About Our Company", name: "about", widget: "text"}
          - {label: "Homepage Photo", name: "hero_image", widget: "image", required: false}

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Project Name", name: "title", widget: "string"}
      - {label: "Project Description", name: "description", widget: "text"}
      - {label: "Project Photo", name: "image", widget: "image"}
      - {label: "Project Category", name: "category", widget: "select", options: ["Flooring", "Painting", "Kitchen Remodeling", "Bathroom Remodeling", "Commercial Renovation", "Other"]}
